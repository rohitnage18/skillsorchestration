name: Browser E2E

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: browser-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  critical-journeys:
    name: Browser critical journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conductor_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conductor_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/conductor_e2e?schema=conductor_app
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/conductor_e2e?schema=conductor_app
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: e2e-auth-secret-value-with-at-least-32-characters
      AUTH_URL: http://127.0.0.1:3100
      AUTH_TRUST_HOST: "true"
      ADMIN_EMAILS: e2e-admin@example.com
      ALLOW_FIRST_USER_ADMIN: "false"
      E2E_TEST_AUTH: "true"
      E2E_TEST_EMAIL: e2e-admin@example.com
      SKILL_EVENTS_TOKEN: e2e-skill-events-token-with-at-least-32-characters
      PLAYWRIGHT_EXTERNAL_SERVER: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conductor-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: conductor-app

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: conductor-app

      - name: Prepare E2E database
        run: npm run test:e2e:prepare
        working-directory: conductor-app

      - name: Start Conductor and wait for readiness
        shell: bash
        working-directory: conductor-app
        run: |
          set -euo pipefail
          server_log="$RUNNER_TEMP/conductor-e2e-server.log"
          server_pid="$RUNNER_TEMP/conductor-e2e-server.pid"
          npm run dev -- --hostname 127.0.0.1 --port 3100 >"$server_log" 2>&1 &
          echo $! >"$server_pid"

          for attempt in {1..90}; do
            if curl --silent --show-error --fail --max-time 5 http://127.0.0.1:3100/login >/dev/null; then
              echo "Conductor is ready."
              exit 0
            fi

            if ! kill -0 "$(cat "$server_pid")" 2>/dev/null; then
              echo "Conductor exited before becoming ready."
              cat "$server_log"
              exit 1
            fi

            sleep 2
          done

          echo "Timed out waiting for Conductor."
          cat "$server_log"
          exit 1

      - name: Run browser critical journeys
        run: npm run test:e2e:run
        working-directory: conductor-app

      - name: Stop Conductor
        if: always()
        shell: bash
        run: |
          server_pid="$RUNNER_TEMP/conductor-e2e-server.pid"
          if [[ -f "$server_pid" ]] && kill -0 "$(cat "$server_pid")" 2>/dev/null; then
            kill "$(cat "$server_pid")"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            conductor-app/playwright-report
            ${{ runner.temp }}/conductor-e2e-server.log
          if-no-files-found: ignore
